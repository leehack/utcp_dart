name: utcp_conformance
description: >-
  Checks the Dart UTCP packages against JSON documents harvested from the UTCP
  specification and the Python and TypeScript SDKs. Not published.
publish_to: none

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  utcp: any
  utcp_cli: any
  utcp_file: any
  utcp_mcp: any
  utcp_socket: any
  utcp_websocket: any

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
