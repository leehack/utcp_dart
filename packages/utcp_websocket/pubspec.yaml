name: utcp_websocket
description: >-
  WebSocket transport for the Dart UTCP client: let LLM agents discover and call tools over ws:// and wss://, on every platform.
version: 0.1.1
repository: https://github.com/leehack/utcp_dart/tree/main/packages/utcp_websocket
issue_tracker: https://github.com/leehack/utcp_dart/issues
topics:
  - utcp
  - websocket
  - llm
  - agents
  - tool-calling

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  crypto: ^3.0.6
  logging: ^1.2.0
  stream_channel: ^2.1.0
  utcp: ^0.2.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  http: ^1.2.0
  lints: ^6.0.0
  test: ^1.26.0
  web_socket: ^1.0.1
