name: utcp
description: >-
  LLM tool calling for Dart and Flutter: a UTCP client that calls tools over HTTP, SSE and OpenAPI directly, with no wrapper server.
version: 0.2.0
repository: https://github.com/leehack/utcp_dart/tree/main/packages/utcp
issue_tracker: https://github.com/leehack/utcp_dart/issues
topics:
  - utcp
  - openapi
  - tool-calling
  - llm
  - agents

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  http: ^1.6.0
  logging: ^1.2.0
  yaml: ^3.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
