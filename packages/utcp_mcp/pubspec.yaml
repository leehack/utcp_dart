name: utcp_mcp
description: >-
  Model Context Protocol (MCP) transport for the Dart UTCP client. Discover
  and call the tools of MCP servers over stdio and streamable HTTP.
version: 0.1.0
repository: https://github.com/leehack/utcp_dart/tree/main/packages/utcp_mcp
issue_tracker: https://github.com/leehack/utcp_dart/issues
topics:
  - utcp
  - mcp
  - ai
  - llm
  - tools

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  http: ^1.5.0
  logging: ^1.2.0
  mcp_dart: ^2.4.3
  utcp: ^0.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
