name: utcp_mcp
description: >-
  MCP transport for the Dart UTCP client: let LLM agents discover and call Model Context Protocol server tools over stdio, streamable HTTP and legacy HTTP+SSE.
version: 0.1.1
repository: https://github.com/leehack/utcp_dart/tree/main/packages/utcp_mcp
issue_tracker: https://github.com/leehack/utcp_dart/issues
topics:
  - utcp
  - mcp
  - llm
  - agents
  - tool-calling

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  http: ^1.5.0
  logging: ^1.2.0
  mcp_dart: ^2.4.3
  utcp: ^0.2.0

dev_dependencies:
  lints: ^6.0.0
  stream_channel: ^2.1.0
  test: ^1.26.0
