name: Publish to pub.dev

# pub.dev automated publishing accepts only an OIDC token from a tag push
# matching the package's `<package>-v{{version}}` pattern, so this cannot run
# inside release_on_prep_merge.yml, which pushes the tags.
on:
  push:
    tags:
      - 'utcp-v[0-9]+.[0-9]+.[0-9]+*'
      - 'utcp_mcp-v[0-9]+.[0-9]+.[0-9]+*'
      - 'utcp_cli-v[0-9]+.[0-9]+.[0-9]+*'
      - 'utcp_file-v[0-9]+.[0-9]+.[0-9]+*'
      - 'utcp_socket-v[0-9]+.[0-9]+.[0-9]+*'
      - 'utcp_websocket-v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve package from tag
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.package.outputs.name }}
      path: ${{ steps.package.outputs.path }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: package
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          name="${TAG_NAME%%-v*}"
          tag_version="${TAG_NAME#"$name-v"}"
          path="packages/$name"
          if [[ ! -f "$path/pubspec.yaml" ]]; then
            echo "Tag $TAG_NAME names no package: $path/pubspec.yaml does not exist." >&2
            exit 1
          fi
          version="$(awk '/^version:[[:space:]]*/ {print $2; exit}' "$path/pubspec.yaml")"
          if [[ "$tag_version" != "$version" ]]; then
            echo "Tag $TAG_NAME is version $tag_version, but $path/pubspec.yaml is $version." >&2
            exit 1
          fi
          {
            echo "name=$name"
            echo "path=$path"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  # Runs `dart pub get`, a dry run and `dart pub publish -f` in the package
  # directory; pub resolves the workspace from the root pubspec.
  publish:
    needs: resolve
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: ${{ needs.resolve.outputs.path }}

  github-release:
    name: Create GitHub Release
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.resolve.outputs.name }}
          PACKAGE_PATH: ${{ needs.resolve.outputs.path }}
          VERSION: ${{ needs.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' "$PACKAGE_PATH/CHANGELOG.md" > "$RUNNER_TEMP/notes.md"
          title="$NAME $VERSION"
          latest=false
          if [[ "$NAME" == utcp ]]; then latest=true; fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title" \
              --notes-file "$RUNNER_TEMP/notes.md" --latest="$latest"
          fi
