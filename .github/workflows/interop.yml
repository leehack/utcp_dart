name: Interop

on:
  push:
    branches: [main]
    paths: &paths
      - 'packages/*/lib/**'
      - 'tool/interop/**'
      - 'tool/src/interop.dart'
      - 'pubspec.yaml'
      - '.github/workflows/interop.yml'
  pull_request:
    paths: *paths

permissions:
  contents: read

jobs:
  round-trip:
    name: Cross-SDK round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tool/interop/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tool/interop/package-lock.json
      - run: dart pub get
      - run: tool/interop/run.sh "$RUNNER_TEMP/interop"
        env:
          PYTHON: python
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interop-documents
          path: ${{ runner.temp }}/interop/out
