name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - name: Release tooling tests
        run: dart test

  test:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [utcp, utcp_mcp, utcp_cli, utcp_file, utcp_socket, utcp_websocket, utcp_conformance]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart test
      - if: matrix.package == 'utcp' || matrix.package == 'utcp_mcp' || matrix.package == 'utcp_websocket'
        run: dart test -p chrome test/unit
      - if: matrix.package == 'utcp_mcp'
        run: dart test -p chrome test/integration test/e2e
      - if: matrix.package == 'utcp_conformance'
        name: Corpus matches a harvest at refs.lock
        run: dart run tool/harvest.dart
